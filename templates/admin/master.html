<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luasafe Developer Dashboard</title>
    <style>
        :root {
            --bg-base: #0f0f12;
            --bg-card: #18181b;
            --border-color: #27272a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #e1e1e6;
            --text-muted: #a1a1aa;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2, h3 { margin-top: 0; color: #ffffff; }
        label { font-size: 13px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 16px 0;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea { height: 150px; font-family: monospace; resize: vertical; }

        button, label.btn-file {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: #000; }
        .btn-file { background: #3f3f46; color: white; }

        .button-group { display: flex; gap: 10px; margin-top: 5px; }
        .button-group button, .button-group label { flex: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; word-break: break-all; }
        th { background: #202024; color: var(--text-muted); }

        .auth-container { max-width: 400px; margin: 80px auto; }
        .hidden { display: none !important; }
        .toggle-link { color: var(--primary); cursor: pointer; text-align: center; margin-top: 15px; display: block; font-size: 14px; }
        .toggle-link:hover { text-decoration: underline; }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 로그인 / 회원가입 화면 -->
    <div id="authView" class="auth-container card hidden">
        <h2 id="authTitle" style="text-align: center; margin-bottom: 20px;">로그인</h2>
        
        <div id="registerFields" class="hidden">
            <label>라이센스</label>
            <input type="text" id="regInvite" placeholder="LUASAFE-XXXX">
        </div>

        <label>아이디</label>
        <input type="text" id="authUsername" placeholder="아이디">

        <label>비밀번호</label>
        <input type="password" id="authPassword" placeholder="비밀번호">

        <button id="authBtn" class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="handleAuth()">로그인</button>
        <span id="authToggleText" class="toggle-link" onclick="toggleAuthMode()">계정이 없으신가요? 회원가입</span>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboardView" class="hidden container">
        <div class="header-bar">
            <h2>Luasafe Developer Dashboard</h2>
            <button class="btn-danger" onclick="logout()">로그아웃</button>
        </div>

        <div class="container" style="padding: 0;">
            <!-- 스크립트 등록 카드 -->
            <div class="card">
                <h3>스크립트 등록 및 수정</h3>
                <label>스크립트 이름</label>
                <input type="text" id="scriptName" placeholder="예: MyHub.lua">
                
                <label>설명</label>
                <input type="text" id="scriptDesc" placeholder="설명">

                <label>루아 소스 코드</label>
                <textarea id="scriptCode" placeholder="코드를 직접 입력하거나 파일 업로드를 이용하세요"></textarea>
                
                <div class="button-group">
                    <button class="btn-success" onclick="saveScript()">스크립트 저장</button>
                    <label class="btn-file">
                        파일 업로드
                        <input type="file" id="scriptFile" accept=".lua,.txt" style="display: none;" onchange="handleFileSelect(event)">
                    </label>
                </div>
            </div>

            <!-- 키 생성 카드 -->
            <div class="card">
                <h3>키 생성</h3>
                <label>연동할 스크립트 선택</label>
                <select id="genScriptName">
                    <option value="">-- 스크립트를 선택하세요 --</option>
                </select>
                
                <label>기간</label>
                <select id="genDuration">
                    <option value="Hours">시간 (Hours)</option>
                    <option value="Days">일 (Days)</option>
                    <option value="Lifetime">평생 (Lifetime)</option>
                </select>

                <label>수량 / 시간 값</label>
                <input type="number" id="genAmount" value="24">

                <button class="btn-success" style="width: 100%;" onclick="generateKey()">키 생성하기</button>
            </div>

            <!-- 스크립트 목록 -->
            <div class="card">
                <h3>등록된 내 스크립트 목록</h3>
                <div id="scriptList">불러오는 중...</div>
            </div>

            <!-- 키 목록 -->
            <div class="card">
                <h3>발급된 키 관리 (HWID / IP 분리)</h3>
                <div id="keyList">불러오는 중...</div>
            </div>
        </div>
    </div>

<script>
    let isRegisterMode = false;

    async function checkSession() {
        try {
            let res = await fetch('/api/admin/check_session');
            let data = await res.json();
            if (data.logged_in) {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('authView').classList.remove('hidden');
            }
        } catch (e) {
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
        }
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            document.getElementById('authTitle').innerText = '회원가입';
            document.getElementById('authBtn').innerText = '회원가입하기';
            document.getElementById('registerFields').classList.remove('hidden');
            document.getElementById('authToggleText').innerText = '이미 계정이 있으신가요? 로그인';
        } else {
            document.getElementById('authTitle').innerText = '로그인';
            document.getElementById('authBtn').innerText = '로그인';
            document.getElementById('registerFields').classList.add('hidden');
            document.getElementById('authToggleText').innerText = '계정이 없으신가요? 회원가입';
        }
    }

    async function handleAuth() {
        let username = document.getElementById('authUsername').value.trim();
        let password = document.getElementById('authPassword').value.trim();
        
        if (!username || !password) return alert("아이디와 비밀번호를 모두 입력해주세요.");

        if (isRegisterMode) {
            let invite_code = document.getElementById('regInvite').value.trim();
            if (!invite_code) return alert("라이센스를 입력해주세요.");

            let res = await fetch('/api/admin/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, invite_code})
            });
            let data = await res.json();
            alert(data.message);
            if (data.success) {
                toggleAuthMode();
            }
        } else {
            let res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            let data = await res.json();
            if (data.success) {
                checkSession();
            } else {
                alert(data.message);
            }
        }
    }

    function handleFileSelect(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('scriptCode').value = e.target.result;
            alert("파일이 로드되었습니다. '스크립트 저장'을 눌러주세요.");
        };
        reader.readAsText(file);
    }

    async function loadData() {
        let sRes = await fetch('/api/admin/scripts');
        if (sRes.status === 401) { checkSession(); return; }
        let sData = await sRes.json();
        
        let sHtml = "<table><tr><th>이름</th><th>설명</th><th>상태</th><th>액션</th></tr>";
        let dropdownHtml = '<option value="">-- 스크립트를 선택하세요 --</option>';
        
        sData.forEach(s => {
            sHtml += `<tr><td>${s.name}</td><td>${s.description || '-'}</td><td>${s.active ? '활성' : '비활성'}</td><td><button class="btn-danger" onclick="deleteScript(${s.id})">삭제</button></td></tr>`;
            dropdownHtml += `<option value="${s.name}">${s.name}</option>`;
        });
        sHtml += "</table>";
        document.getElementById('scriptList').innerHTML = sHtml;
        document.getElementById('genScriptName').innerHTML = dropdownHtml;

        let kRes = await fetch('/api/admin/keys');
        let kData = await kRes.json();
        
        let kHtml = "<table><tr><th>키</th><th>스크립트</th><th>만료시간</th><th>HWID</th><th>IP 주소</th><th>실행</th><th>관리</th></tr>";
        kData.forEach(k => {
            let ipVal = (k.ip && k.ip !== '지정 안됨') ? k.ip : '<span style="color:#71717a;">미등록</span>';
            kHtml += `<tr>
                <td>${k.key}</td>
                <td>${k.script_name || '-'}</td>
                <td>${k.expiry}</td>
                <td><small>${k.hwid}</small></td>
                <td><small>${ipVal}</small></td>
                <td>${k.execs}</td>
                <td>
                    <button class="btn-danger" onclick="deleteKey(${k.id})">삭제</button> 
                    <button class="btn-primary" onclick="resetHwid(${k.id})">HWID초기화</button>
                    <button class="btn-warning" onclick="resetIp(${k.id})">IP초기화</button>
                </td>
            </tr>`;
        });
        kHtml += "</table>";
        document.getElementById('keyList').innerHTML = kHtml;
    }

    async function saveScript() {
        let name = document.getElementById('scriptName').value.trim();
        let description = document.getElementById('scriptDesc').value.trim();
        let luaCode = document.getElementById('scriptCode').value;

        if (!name) return alert("스크립트 이름을 입력해주세요.");

        let res = await fetch('/api/admin/scripts/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, description, lua_code: luaCode})
        });
        if (res.status === 401) { alert("로그인이 만료되었습니다."); checkSession(); return; }
        let data = await res.json();
        if (data.success) {
            alert("스크립트가 저장되었습니다.");
            loadData();
        } else {
            alert(data.message);
        }
    }

    async function deleteScript(id) {
        if (!confirm("정말 삭제하시겠습니까?")) return;
        await fetch('/api/admin/scripts/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        loadData();
    }

    async function generateKey() {
        let script_name = document.getElementById('genScriptName').value;
        if (!script_name) return alert("연동할 스크립트를 선택해주세요.");
        
        let duration_type = document.getElementById('genDuration').value;
        let amount = document.getElementById('genAmount').value;

        let res = await fetch('/api/admin/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({script_name, duration_type, amount})
        });
        if (res.status === 401) { alert("로그인이 만료되었습니다."); checkSession(); return; }
        let data = await res.json();
        if (data.success) {
            alert("키 생성 성공: " + data.key);
            loadData();
        } else {
            alert(data.message);
        }
    }

    async function deleteKey(id) {
        if (!confirm("정말 이 키를 삭제하시겠습니까?")) return;
        await fetch('/api/admin/keys/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        loadData();
    }

    async function resetHwid(id) {
        let res = await fetch('/api/admin/keys/reset_hwid', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        let data = await res.json();
        alert(data.message);
        loadData();
    }

    async function resetIp(id) {
        let res = await fetch('/api/admin/keys/reset_ip', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        let data = await res.json();
        alert(data.message);
        loadData();
    }

    async function logout() {
        await fetch('/api/admin/logout', {method: 'POST'});
        checkSession();
    }

    checkSession();
</script>

</body>
</html>
