<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luasafe — Enterprise Security & VM Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #09090b;
            --bg-card: rgba(24, 24, 27, 0.7);
            --border-color: rgba(63, 63, 70, 0.4);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { border-color: rgba(99, 102, 241, 0.3); }

        h2, h3 { margin-top: 0; font-weight: 600; letter-spacing: -0.5px; }
        label { font-size: 13px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 16px;
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        textarea { height: 180px; font-family: monospace; resize: vertical; }

        button, label.btn-file {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-warning:hover { background: var(--warning); color: black; }
        .btn-file { background: rgba(63, 63, 70, 0.4); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-file:hover { background: rgba(63, 63, 70, 0.7); }

        .button-group { display: flex; gap: 12px; margin-top: 5px; }
        .button-group button, .button-group label { flex: 1; }

        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 12px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: rgba(24, 24, 27, 0.9); color: var(--text-muted); font-weight: 600; }
        tr:hover td { background: rgba(255, 255, 255, 0.01); }

        .auth-container { max-width: 420px; margin: 100px auto; animation: fadeIn 0.4s ease-out; }
        .hidden { display: none !important; }
        .toggle-link { color: var(--primary); cursor: pointer; text-align: center; margin-top: 16px; display: block; font-size: 13px; font-weight: 500; }
        .toggle-link:hover { text-decoration: underline; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <!-- 고급 로그인 / 회원가입 화면 -->
    <div id="authView" class="auth-container card hidden">
        <h2 id="authTitle" style="text-align: center; margin-bottom: 24px; font-size: 22px;">Luasafe Secure Portal</h2>
        
        <div id="registerFields" class="hidden">
            <label>라이센스</label>
            <input type="text" id="regInvite" placeholder="LUASAFE-XXXX">
        </div>

        <label>개발자 아이디</label>
        <input type="text" id="authUsername" placeholder="Enter username">

        <label>비밀번호</label>
        <input type="password" id="authPassword" placeholder="Enter password">

        <button id="authBtn" class="btn-primary" style="width: 100%; margin-top: 8px; padding: 12px;" onclick="handleAuth()">로그인</button>
        <span id="authToggleText" class="toggle-link" onclick="toggleAuthMode()">계정이 없으신가요? 회원가입</span>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboardView" class="hidden container">
        <div class="header-bar">
            <div>
                <h2 style="margin: 0; font-size: 22px;">🛠️ Luasafe Developer Studio</h2>
                <span style="font-size: 13px; color: var(--text-muted);">Advanced VM Obfuscation & License Management</span>
            </div>
            <button class="btn-danger" onclick="logout()">로그아웃</button>
        </div>

        <!-- 스크립트 등록 카드 -->
        <div class="card">
            <h3>스마트 스크립트 관리</h3>
            <label>스크립트 식별 이름</label>
            <input type="text" id="scriptName" placeholder="예: Hub_V1.lua">
            
            <label>스크립트 설명</label>
            <input type="text" id="scriptDesc" placeholder="기능 요약 및 메모">

            <label>루아 소스 코드 (VM 자동 가상화 적용)</label>
            <textarea id="scriptCode" placeholder="-- 루아 코드를 직접 입력하거나 파일을 업로드하세요"></textarea>
            
            <div class="button-group">
                <button class="btn-success" onclick="saveScript()">스크립트 저장 및 암호화</button>
                <label class="btn-file">
                    파일 업로드
                    <input type="file" id="scriptFile" accept=".lua,.txt" style="display: none;" onchange="handleFileSelect(event)">
                </label>
            </div>
        </div>

        <!-- 키 생성 카드 -->
        <div class="card">
            <h3>라이센스 키 발급</h3>
            <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px;">
                <div>
                    <label>연동할 스크립트</label>
                    <select id="genScriptName">
                        <option value="">-- 스크립트 선택 --</option>
                    </select>
                </div>
                <div>
                    <label>기간 단위</label>
                    <select id="genDuration">
                        <option value="Hours">시간 (Hours)</option>
                        <option value="Days">일 (Days)</option>
                        <option value="Lifetime">평생 (Lifetime)</option>
                    </select>
                </div>
                <div>
                    <label>수량/시간 값</label>
                    <input type="number" id="genAmount" value="24">
                </div>
            </div>
            <button class="btn-success" style="width: 100%; margin-top: 8px;" onclick="generateKey()">⚡ 시큐어 키 발급하기</button>
        </div>

        <!-- 스크립트 목록 -->
        <div class="card">
            <h3>등록된 스크립트 목록</h3>
            <div id="scriptList" style="overflow-x: auto;">불러오는 중...</div>
        </div>

        <!-- 키 목록 -->
        <div class="card">
            <h3>발급된 키 관리 (HWID / IP 모니터링)</h3>
            <div id="keyList" style="overflow-x: auto;">불러오는 중...</div>
        </div>
    </div>

<script>
    let isRegisterMode = false;

    async function checkSession() {
        try {
            let res = await fetch('/api/admin/check_session');
            let data = await res.json();
            if (data.logged_in) {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                loadData();
            } else {
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('authView').classList.remove('hidden');
            }
        } catch (e) {
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('authView').classList.remove('hidden');
        }
    }

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        if (isRegisterMode) {
            document.getElementById('authTitle').innerText = 'Luasafe 회원가입';
            document.getElementById('authBtn').innerText = '가입 완료하기';
            document.getElementById('registerFields').classList.remove('hidden');
            document.getElementById('authToggleText').innerText = '이미 계정이 있으신가요? 로그인';
        } else {
            document.getElementById('authTitle').innerText = 'Luasafe Secure Portal';
            document.getElementById('authBtn').innerText = '로그인';
            document.getElementById('registerFields').classList.add('hidden');
            document.getElementById('authToggleText').innerText = '계정이 없으신가요? 회원가입';
        }
    }

    async function handleAuth() {
        let username = document.getElementById('authUsername').value.trim();
        let password = document.getElementById('authPassword').value.trim();
        
        if (!username || !password) return alert("아이디와 비밀번호를 모두 입력해주세요.");

        if (isRegisterMode) {
            let invite_code = document.getElementById('regInvite').value.trim();
            if (!invite_code) return alert("초대 코드를 입력해주세요.");

            let res = await fetch('/api/admin/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password, invite_code})
            });
            let data = await res.json();
            alert(data.message);
            if (data.success) toggleAuthMode();
        } else {
            let res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            let data = await res.json();
            if (data.success) {
                checkSession();
            } else {
                alert(data.message);
            }
        }
    }

    function handleFileSelect(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('scriptCode').value = e.target.result;
            alert("파일 소스가 성공적으로 로드되었습니다.");
        };
        reader.readAsText(file);
    }

    async function loadData() {
        let sRes = await fetch('/api/admin/scripts');
        if (sRes.status === 401) { checkSession(); return; }
        let sData = await sRes.json();
        
        let sHtml = "<table><tr><th>이름</th><th>설명</th><th>상태</th><th>관리</th></tr>";
        let dropdownHtml = '<option value="">-- 스크립트 선택 --</option>';
        
        sData.forEach(s => {
            sHtml += `<tr><td><b>${s.name}</b></td><td>${s.description || '-'}</td><td><span style="color:${s.active?'var(--success)':'var(--danger)'}">${s.active ? '● 활성' : '○ 비활성'}</span></td><td><button class="btn-danger" onclick="deleteScript(${s.id})">삭제</button></td></tr>`;
            dropdownHtml += `<option value="${s.name}">${s.name}</option>`;
        });
        sHtml += "</table>";
        document.getElementById('scriptList').innerHTML = sHtml;
        document.getElementById('genScriptName').innerHTML = dropdownHtml;

        let kRes = await fetch('/api/admin/keys');
        let kData = await kRes.json();
        
        let kHtml = "<table><tr><th>시큐어 키</th><th>연동 스크립트</th><th>만료 시간</th><th>HWID</th><th>IP 주소</th><th>실행 횟수</th><th>관리</th></tr>";
        kData.forEach(k => {
            let ipVal = (k.ip && k.ip !== '지정 안됨') ? k.ip : '<span style="color:var(--text-muted);">미등록</span>';
            kHtml += `<tr>
                <td><code style="color:var(--primary);">${k.key}</code></td>
                <td>${k.script_name || '-'}</td>
                <td>${k.expiry}</td>
                <td><small style="font-family:monospace;">${k.hwid}</small></td>
                <td><small>${ipVal}</small></td>
                <td><b>${k.execs}회</b></td>
                <td>
                    <div style="display:flex; gap:6px;">
                        <button class="btn-danger" style="padding:6px 10px;" onclick="deleteKey(${k.id})">삭제</button> 
                        <button class="btn-primary" style="padding:6px 10px;" onclick="resetHwid(${k.id})">HWID초기화</button>
                        <button class="btn-warning" style="padding:6px 10px;" onclick="resetIp(${k.id})">IP초기화</button>
                    </div>
                </td>
            </tr>`;
        });
        kHtml += "</table>";
        document.getElementById('keyList').innerHTML = kHtml;
    }

    async function saveScript() {
        let name = document.getElementById('scriptName').value.trim();
        let description = document.getElementById('scriptDesc').value.trim();
        let luaCode = document.getElementById('scriptCode').value;

        if (!name) return alert("스크립트 이름을 입력해주세요.");

        let res = await fetch('/api/admin/scripts/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, description, lua_code: luaCode})
        });
        if (res.status === 401) { checkSession(); return; }
        let data = await res.json();
        if (data.success) {
            alert("스크립트가 가상화 엔진에 등록되었습니다.");
            loadData();
        } else {
            alert(data.message);
        }
    }

    async function deleteScript(id) {
        if (!confirm("정말 이 스크립트를 삭제하시겠습니까?")) return;
        await fetch('/api/admin/scripts/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        loadData();
    }

    async function generateKey() {
        let script_name = document.getElementById('genScriptName').value;
        if (!script_name) return alert("연동할 스크립트를 선택해주세요.");
        
        let duration_type = document.getElementById('genDuration').value;
        let amount = document.getElementById('genAmount').value;

        let res = await fetch('/api/admin/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({script_name, duration_type, amount})
        });
        if (res.status === 401) { checkSession(); return; }
        let data = await res.json();
        if (data.success) {
            alert("키 발급 성공:\n" + data.key);
            loadData();
        } else {
            alert(data.message);
        }
    }

    async function deleteKey(id) {
        if (!confirm("정말 이 키를 폐기하시겠습니까?")) return;
        await fetch('/api/admin/keys/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        loadData();
    }

    async function resetHwid(id) {
        let res = await fetch('/api/admin/keys/reset_hwid', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        let data = await res.json();
        alert(data.message);
        loadData();
    }

    async function resetIp(id) {
        let res = await fetch('/api/admin/keys/reset_ip', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({id: id})
        });
        let data = await res.json();
        alert(data.message);
        loadData();
    }

    async function logout() {
        await fetch('/api/admin/logout', {method: 'POST'});
        checkSession();
    }

    checkSession();
</script>

</body>
</html>
