<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luasafe Management</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141418;
            --border-color: #23232a;
            --text-color: #e0e0e0;
            --accent-color: #e74c3c;
            --accent-hover: #c0392b;
            --input-bg: #09090b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary { background: #ffffff; color: #000000; }
        .btn-success { background: #27ae60; color: #ffffff; }

        .link-text {
            font-size: 13px;
            color: #a0a0a0;
            cursor: pointer;
            margin-top: 12px;
        }
        .link-text span {
            color: #f39c12;
            text-decoration: underline;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button.action-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        th { color: #888; font-weight: normal; }

        .btn-kill { background: var(--accent-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-active { background: #27ae60; color: white; }
    </style>
</head>
<body>

<!-- 관리자 로그인 / 회원가입 창 -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h2 id="adminFormTitle">Admin Login</h2>
        <input type="text" id="adminUser" placeholder="Username">
        <input type="password" id="adminPass" placeholder="Password">
        <button id="adminAuthBtn" class="btn-primary" onclick="handleAdminAuth()">Login</button>
        <div class="link-text" id="adminToggleLink" onclick="toggleAdminMode()">계정이 없나요? <span>관리자 회원가입하기</span></div>
    </div>
</div>

<!-- 원래 관리자 대시보드 화면 -->
<div id="mainDashboard" style="display:none;">
    <div class="header">
        <h2>luasafe Management</h2>
        <button class="btn-kill" id="killSwitchBtn" onclick="toggleKillSwitch()">🚨 킬스위치 OFF</button>
    </div>

    <div class="grid">
        <!-- 디스코드 웹훅 설정 -->
        <div class="card">
            <h3>디스코드 웹훅 설정</h3>
            <label>디스코드 웹훅 URL</label>
            <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/...">
            <button class="action-btn" onclick="saveSettings()">설정 저장</button>
        </div>

        <!-- 스크립트별 키 생성 -->
        <div class="card">
            <h3>스크립트별 키 생성</h3>
            <label>대상 스크립트</label>
            <select id="genScriptSelect"></select>
            <label>기간 설정</label>
            <select id="genDurationType">
                <option value="Hours">시간 (Hours)</option>
                <option value="Days">일 (Days)</option>
                <option value="Lifetime">영구 (Lifetime)</option>
            </select>
            <label>수치 입력</label>
            <input type="number" id="genAmount" value="24">
            <button class="action-btn" onclick="generateKey()">키 발급</button>
        </div>
    </div>

    <!-- 스크립트 관리 및 수정 -->
    <div class="card" style="margin-bottom: 20px;">
        <h3>스크립트 관리 및 수정</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <label>스크립트 이름</label>
                <input type="text" id="scriptName" placeholder="Test">
                <label>설명</label>
                <input type="text" id="scriptDesc" placeholder="설명 입력">
            </div>
            <div>
                <label>Lua 코드</label>
                <textarea id="scriptCode" rows="4" placeholder="loadstring(game:HttpGet(...))()"></textarea>
            </div>
        </div>
        <button class="action-btn" onclick="addScript()">스크립트 등록 / 수정 저장</button>

        <h4 style="margin-top: 20px; font-size: 14px;">등록된 스크립트 목록</h4>
        <table>
            <thead>
                <tr>
                    <th>파일명</th>
                    <th>설명</th>
                    <th>상태</th>
                    <th>액션</th>
                </tr>
            </thead>
            <tbody id="scriptTableBody"></tbody>
        </table>
    </div>

    <!-- 활성 키 목록 -->
    <div class="card">
        <h3>활성 키 목록</h3>
        <table>
            <thead>
                <tr>
                    <th>키</th>
                    <th>등급</th>
                    <th>상태</th>
                    <th>HWID</th>
                    <th>실행수</th>
                    <th>만료</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="keyTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let isAdminSignup = false;

    // 회원가입 <-> 로그인 토글
    function toggleAdminMode() {
        isAdminSignup = !isAdminSignup;
        if (isAdminSignup) {
            document.getElementById('adminFormTitle').innerText = "Admin Register";
            document.getElementById('adminAuthBtn').innerText = "Register";
            document.getElementById('adminAuthBtn').className = "btn-success";
            document.getElementById('adminToggleLink').innerHTML = "이미 계정이 있으신가요? <span>로그인하기</span>";
        } else {
            document.getElementById('adminFormTitle').innerText = "Admin Login";
            document.getElementById('adminAuthBtn').innerText = "Login";
            document.getElementById('adminAuthBtn').className = "btn-primary";
            document.getElementById('adminToggleLink').innerHTML = "계정이 없나요? <span>관리자 회원가입하기</span>";
        }
    }

    // 관리자 인증 처리
    async function handleAdminAuth() {
        let username = document.getElementById('adminUser').value.trim();
        let password = document.getElementById('adminPass').value.trim();

        if (!username || !password) {
            alert("아이디와 비밀번호를 입력하세요.");
            return;
        }

        let endpoint = isAdminSignup ? '/api/user/signup' : '/api/admin/login';

        try {
            let res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });
            let data = await res.json();

            if (data.success) {
                if (isAdminSignup) {
                    alert("관리자 계정 회원가입이 완료되었습니다! 로그인해주세요.");
                    toggleAdminMode();
                } else {
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('mainDashboard').style.display = 'block';
                    loadDashboardData();
                }
            } else {
                alert(data.message || "인증 실패");
            }
        } catch (e) {
            alert("서버와 통신할 수 없습니다.");
        }
    }

    // 대시보드 데이터 로드
    async function loadDashboardData() {
        loadSettings();
        loadScripts();
        loadKeys();
    }

    async function loadSettings() {
        try {
            let res = await fetch('/api/admin/settings/get');
            let data = await res.json();
            document.getElementById('webhookUrl').value = data.webhook_url || '';
            updateKillBtn(data.kill_switch === 'true');
        } catch (e) {}
    }

    function updateKillBtn(isKill) {
        let btn = document.getElementById('killSwitchBtn');
        if (isKill) {
            btn.innerText = "🚨 킬스위치 ON (작동중)";
            btn.style.background = "#27ae60";
        } else {
            btn.innerText = "🚨 킬스위치 OFF";
            btn.style.background = "#e74c3c";
        }
    }

    async function toggleKillSwitch() {
        let res = await fetch('/api/admin/toggle_kill', { method: 'POST' });
        let data = await res.json();
        updateKillBtn(data.kill_switch === 'true');
    }

    async function saveSettings() {
        let url = document.getElementById('webhookUrl').value;
        let res = await fetch('/api/admin/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ webhook_url: url })
        });
        let data = await res.json();
        if (data.success) alert("설정이 저장되었습니다.");
    }

    async function loadScripts() {
        let res = await fetch('/api/admin/scripts');
        let scripts = await res.json();

        let select = document.getElementById('genScriptSelect');
        select.innerHTML = '';
        let tbody = document.getElementById('scriptTableBody');
        tbody.innerHTML = '';

        scripts.forEach(s => {
            let opt = document.createElement('option');
            opt.value = s.name;
            opt.innerText = s.name;
            select.appendChild(opt);

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.name}</td>
                <td>${s.description || '-'}</td>
                <td><span class="badge ${s.active ? 'badge-active' : ''}">${s.active ? '활성화' : '비활성'}</span></td>
                <td>
                    <button onclick="editScript('${s.name}', '${s.description || ''}')" style="padding: 2px 6px; font-size: 11px;">수정</button>
                    <button onclick="deleteScript(${s.id})" style="padding: 2px 6px; font-size: 11px; background: #e74c3c; color: #fff; border: none; border-radius: 3px;">삭제</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addScript() {
        let name = document.getElementById('scriptName').value.trim();
        let desc = document.getElementById('scriptDesc').value.trim();
        let code = document.getElementById('scriptCode').value;

        let res = await fetch('/api/admin/scripts/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, description: desc, lua_code: code })
        });
        let data = await res.json();
        if (data.success) {
            alert("스크립트가 저장되었습니다.");
            loadScripts();
        } else {
            alert(data.message);
        }
    }

    function editScript(name, desc) {
        document.getElementById('scriptName').value = name;
        document.getElementById('scriptDesc').value = desc;
    }

    async function deleteScript(id) {
        if (!confirm("정말 삭제하시겠습니까?")) return;
        let res = await fetch('/api/admin/scripts/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        });
        if ((await res.json()).success) loadScripts();
    }

    async function loadKeys() {
        let res = await fetch('/api/admin/keys');
        let keys = await res.json();
        let tbody = document.getElementById('keyTableBody');
        tbody.innerHTML = '';

        keys.forEach(k => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-family: monospace;">${k.key}</td>
                <td>${k.tier}</td>
                <td><span class="badge badge-active">${k.status}</span></td>
                <td style="font-size: 11px;">${k.hwid}</td>
                <td>${k.execs}</td>
                <td>${k.expiry}</td>
                <td><button onclick="deleteKey(${k.id})" style="padding: 2px 6px; font-size: 11px; background: #e74c3c; color: white; border: none; border-radius: 3px;">삭제</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function generateKey() {
        let scriptName = document.getElementById('genScriptSelect').value;
        let durType = document.getElementById('genDurationType').value;
        let amount = document.getElementById('genAmount').value;

        let res = await fetch('/api/admin/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script_name: scriptName, duration_type: durType, amount: amount })
        });
        let data = await res.json();
        if (data.success) {
            alert("발급 성공!\n키: " + data.key);
            loadKeys();
        } else {
            alert(data.message);
        }
    }

    async function deleteKey(id) {
        if (!confirm("정말 키를 삭제하시겠습니까?")) return;
        let res = await fetch('/api/admin/keys/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id })
        });
        if ((await res.json()).success) loadKeys();
    }
</script>

</body>
</html>
