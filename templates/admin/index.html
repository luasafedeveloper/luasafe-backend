<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luasafe Admin Hub</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
        .login-container { max-width: 400px; margin: 100px auto; background: #141414; padding: 25px; border-radius: 12px; border: 1px solid #262626; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #1f1f1f; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .btn-primary { background: #fff; color: #000; }
        .btn-success { background: #27ae60; color: #fff; }
        .link-text { font-size: 13px; color: #a0a0a0; cursor: pointer; margin-top: 10px; }
        .link-text span { color: #f39c12; text-decoration: underline; }
    </style>
</head>
<body>

<div id="loginSection" class="login-container">
    <h2 id="formTitle">Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button id="authBtn" class="btn-primary" onclick="handleAdminAuth()">Login</button>
    <div class="link-text" id="toggleLink" onclick="toggleAdminMode()">계정이 없나요? <span>관리자 회원가입하기</span></div>
</div>

<div id="adminPanel" style="display:none;">
    <h1>관리자 패널</h1>
    <p>성공적으로 로그인되었습니다!</p>
    <button class="btn-primary" onclick="location.reload()">로그아웃</button>
</div>

<script>
    let isSignup = false;

    function toggleAdminMode() {
        isSignup = !isSignup;
        if (isSignup) {
            document.getElementById('formTitle').innerText = "Admin Signup";
            document.getElementById('authBtn').innerText = "Register";
            document.getElementById('authBtn').className = "btn-success";
            document.getElementById('toggleLink').innerHTML = "이미 계정이 있으신가요? <span>로그인하기</span>";
        } else {
            document.getElementById('formTitle').innerText = "Admin Login";
            document.getElementById('authBtn').innerText = "Login";
            document.getElementById('authBtn').className = "btn-primary";
            document.getElementById('toggleLink').innerHTML = "계정이 없나요? <span>관리자 회원가입하기</span>";
        }
    }

    async function handleAdminAuth() {
        let username = document.getElementById('adminUser').value.trim();
        let password = document.getElementById('adminPass').value.trim();
        if (!username || !password) {
            alert("아이디와 비밀번호를 입력해주세요.");
            return;
        }

        let endpoint = isSignup ? '/api/user/signup' : '/api/admin/login';

        try {
            let res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });
            let data = await res.json();

            if (data.success) {
                if (isSignup) {
                    alert("관리자 회원가입 완료! 로그인해주세요.");
                    toggleAdminMode();
                } else {
                    alert("로그인 성공!");
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                }
            } else {
                alert(data.message || "로그인 실패");
            }
        } catch (e) {
            alert("통신 오류 발생");
        }
    }
</script>

</body>
</html>
