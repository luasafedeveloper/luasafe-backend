<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luasafe Loader Hub</title>
    <style>
        body { background-color: #0f0f12; color: #e1e1e6; font-family: sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; }
        .card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #27272a; border: 1px solid #3f3f46; border-radius: 6px; color: #fff; box-sizing: border-box; }
        textarea { resize: none; height: 85px; font-family: monospace; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #6366f1; color: white; margin-top: 10px; }
        .btn-success { background: #10b981; color: white; margin-top: 10px; }
        .info-box { background: #27272a; padding: 12px; border-radius: 6px; margin-top: 15px; font-size: 14px; display: none; }
        .footer-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .footer-link a { color: #818cf8; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Luasafe Loader Hub</h2>
        <label>발급받은 키 입력</label>
        <input type="text" id="keyInput" placeholder="luasafe-XXXX-XXXX-XXXX">
        <button class="btn-primary" onclick="lookupKey()">로더 코드 발급받기</button>

        <div id="resultBox" class="info-box">
            <p style="margin: 0 0 8px 0; color: #a1a1aa; font-size: 12px;">복사해서 게임에 실행할 로더 코드:</p>
            <textarea id="loaderCodeOutput" readonly style="background: #18181b; font-size: 12px; color: #10b981; cursor: pointer;" onclick="copyLoaderCode()"></textarea>
            <button class="btn-success" onclick="copyLoaderCode()">로더 코드 복사하기</button>
            <hr style="border: 0; border-top: 1px solid #3f3f46; margin: 12px 0;">
            <p id="statusText" style="margin: 4px 0;"></p>
            <p id="scriptText" style="margin: 4px 0;"></p>
            <p id="expiryText" style="margin: 4px 0;"></p>
            <p id="hwidText" style="margin: 4px 0;"></p>
        </div>

        <div class="footer-link">
            <a href="/admin">👉 개발자 포털 (스크립트/키 관리) 가기</a>
        </div>
    </div>
</div>

<script>
    async function lookupKey() {
        let key = document.getElementById('keyInput').value.trim();
        if (!key) return alert("키를 입력해주세요.");

        let res = await fetch('/api/user/lookup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({key: key})
        });
        let data = await res.json();

        if (data.success) {
            document.getElementById('resultBox').style.display = 'block';
            
            // 요청하신 대로 scriptkey 선언과 loadstring 사이에 빈 줄(\n\n)을 두어 한 줄 내린 형태로 출력
            let loaderPayload = `scriptkey = "${data.key}"\n\nloadstring(game:HttpGet("https://luasafe-backend.onrender.com/loader.lua"))()`;
            document.getElementById('loaderCodeOutput').value = loaderPayload;

            document.getElementById('statusText').innerHTML = `<b>상태:</b> <span style="color: #10b981;">${data.status}</span>`;
            document.getElementById('scriptText').innerHTML = `<b>연동 스크립트:</b> ${data.script_name || '-'}`;
            document.getElementById('expiryText').innerHTML = `<b>만료 시간:</b> ${data.expiry}`;
            document.getElementById('hwidText').innerHTML = `<b>등록된 HWID:</b> ${data.hwid}`;
        } else {
            alert(data.message);
            document.getElementById('resultBox').style.display = 'none';
        }
    }

    function copyLoaderCode() {
        let copyText = document.getElementById('loaderCodeOutput');
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("로더 코드가 복사되었습니다!");
    }
</script>

</body>
</html>
