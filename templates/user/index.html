<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luasafe - User Hub</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .section {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #a0a0a0;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        input:focus, select:focus {
            border-color: #f39c12;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        .btn-primary { background-color: #ffffff; color: #000000; }
        .btn-primary:hover { background-color: #dcdcdc; }
        .btn-success { background-color: #27ae60; color: #ffffff; }
        .btn-success:hover { background-color: #219653; }
        .btn-warning { background-color: #f39c12; color: #000000; }
        .btn-warning:hover { background-color: #e67e22; }
        .btn-danger { background-color: #e74c3c; color: #ffffff; }
        .btn-danger:hover { background-color: #c0392b; }
        .link-text {
            text-align: center;
            font-size: 13px;
            color: #a0a0a0;
            cursor: pointer;
            margin-top: 10px;
        }
        .link-text span {
            color: #f39c12;
            text-decoration: underline;
        }
        pre {
            background-color: #0a0a0a;
            border: 1px solid #222;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            color: #2ecc71;
            max-height: 150px;
        }
        .info-box {
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            margin-top: 15px;
            border: 1px solid #262626;
        }
        .info-box div { margin-bottom: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="formTitle">Luasafe 로그인</h2>

    <!-- 로그인 및 회원가입 입력 폼 -->
    <div id="authSection">
        <div class="section">
            <label>아이디</label>
            <input type="text" id="usernameInput" placeholder="아이디를 입력하세요">
            <label>비밀번호</label>
            <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요">
        </div>
        <button id="authBtn" class="btn-primary" onclick="handleAuth()">로그인</button>
        <div class="link-text" id="toggleLink" onclick="toggleMode()">계정이 없나요? <span>회원가입하기</span></div>
    </div>

    <!-- 로그인 성공 후 허브 창 -->
    <div id="hubSection" style="display:none;">
        <div class="section">
            <label>발급된 내 키 (<span id="userDisplay" style="color:#f39c12;"></span>)</label>
            <input type="text" id="keyInput" readonly style="color: #f39c12; font-weight: bold;">
        </div>

        <div class="section">
            <label>생성된 로더 코드 (복사해서 사용)</label>
            <pre id="loaderOutput"></pre>
            <button class="btn-primary" onclick="copyLoader()">로더 코드 복사하기</button>
        </div>

        <div class="info-box" id="infoBox">
            <div><strong>상태:</strong> <span id="statusText">-</span></div>
            <div><strong>등급:</strong> <span id="tierText">-</span></div>
            <div><strong>만료 시간:</strong> <span id="expiryText">-</span></div>
            <div><strong>등록된 HWID:</strong> <span id="hwidText">-</span></div>
            
            <div style="margin-top: 12px;">
                <label>사용할 스크립트 선택</label>
                <select id="scriptSelect"></select>
            </div>
            <button class="btn-warning" onclick="resetHwid()" style="margin-top: 10px;">HWID 초기화 및 스크립트 변경 (3일 쿨타임)</button>
        </div>
        
        <button class="btn-danger" onclick="logout()" style="margin-top: 15px;">로그아웃</button>
    </div>
</div>

<script>
    let isSignupMode = false;
    let currentKey = "";

    // 페이지 로드 시 기존 세션(로그인 상태) 확인
    window.onload = async function() {
        try {
            let res = await fetch('/api/user/check_session');
            let data = await res.json();
            if (data.logged_in) {
                showHub(data.username, data.key);
            }
        } catch (e) {}
    };

    function toggleMode() {
        isSignupMode = !isSignupMode;
        if (isSignupMode) {
            document.getElementById('formTitle').innerText = "Luasafe 회원가입";
            document.getElementById('authBtn').innerText = "회원가입 하기";
            document.getElementById('authBtn').className = "btn-success";
            document.getElementById('toggleLink').innerHTML = "이미 계정이 있으신가요? <span>로그인하기</span>";
        } else {
            document.getElementById('formTitle').innerText = "Luasafe 로그인";
            document.getElementById('authBtn').innerText = "로그인";
            document.getElementById('authBtn').className = "btn-primary";
            document.getElementById('toggleLink').innerHTML = "계정이 없나요? <span>회원가입하기</span>";
        }
    }

    async function handleAuth() {
        let username = document.getElementById('usernameInput').value.trim();
        let password = document.getElementById('passwordInput').value.trim();

        if (!username || !password) {
            alert("아이디와 비밀번호를 모두 입력해주세요.");
            return;
        }

        let endpoint = isSignupMode ? '/api/user/signup' : '/api/user/login';

        try {
            let res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            });
            let data = await res.json();

            if (data.success) {
                if (isSignupMode) {
                    alert(data.message);
                    toggleMode(); // 로그인 화면으로 전환
                } else {
                    showHub(username, data.key);
                }
            } else {
                alert(data.message);
            }
        } catch (e) {
            alert("서버 통신 오류가 발생했습니다.");
        }
    }

    function showHub(username, key) {
        currentKey = key;
        document.getElementById('userDisplay').innerText = username;
        document.getElementById('keyInput').value = currentKey;
        
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('formTitle').innerText = "Luasafe Key & Script Hub";
        document.getElementById('hubSection').style.display = 'block';

        lookupKey(currentKey);
    }

    async function lookupKey(key) {
        try {
            let res = await fetch('/api/user/lookup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: key })
            });
            let data = await res.json();

            if (data.success) {
                document.getElementById('statusText').innerText = data.status;
                document.getElementById('tierText').innerText = data.tier;
                document.getElementById('expiryText').innerText = data.expiry;
                document.getElementById('hwidText').innerText = data.hwid;

                let cleanLoader = `scriptkey = "${data.key}"\n\nloadstring(game:HttpGet("https://luasafe-backend.onrender.com/loader.lua"))()`;
                document.getElementById('loaderOutput').innerText = cleanLoader;

                loadUserScripts(data.script_name);
            }
        } catch (e) {}
    }

    async function loadUserScripts(selectedName) {
        try {
            let res = await fetch('/api/user/scripts');
            let scripts = await res.json();
            let select = document.getElementById('scriptSelect');
            select.innerHTML = '';
            scripts.forEach(s => {
                let opt = document.createElement('option');
                opt.value = s.name;
                opt.innerText = s.name + (s.description ? ` (${s.description})` : '');
                if (s.name === selectedName) opt.selected = true;
                select.appendChild(opt);
            });
        } catch (e) {}
    }

    async function resetHwid() {
        if (!confirm("정말 HWID를 초기화하시겠습니까? (3일 동안 재초기화 불가)")) return;
        let newScript = document.getElementById('scriptSelect').value;

        try {
            let res = await fetch('/api/user/reset_hwid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: currentKey, script_name: newScript })
            });
            let data = await res.json();
            alert(data.message);
            if (data.success) lookupKey(currentKey);
        } catch (e) {
            alert("통신 오류");
        }
    }

    async function logout() {
        try {
            await fetch('/api/user/logout', { method: 'POST' });
            location.reload();
        } catch (e) {
            location.reload();
        }
    }

    function copyLoader() {
        let code = document.getElementById('loaderOutput').innerText;
        navigator.clipboard.writeText(code).then(() => {
            alert("로더 코드가 복사되었습니다!");
        });
    }
</script>

</body>
</html>
